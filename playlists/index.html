<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playlists — Wallfellow</title>
    <meta
      name="description"
      content="Wallfellow Thanksgiving, the November 2026 playlist."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="page">
    <header class="site-header">
      <a class="wordmark" href="../">Wallfellow</a>
      <nav class="site-nav" aria-label="Primary">
        <a class="nav-link" href="../pieces/">Pieces</a>
        <a class="nav-link" href="./" aria-current="page">Playlists</a>
        <a class="nav-link" href="../about/">About</a>
      </nav>
    </header>

    <main class="page-main">
      <p class="page-kicker">Listening</p>
      <h1 class="page-title">Playlists</h1>

      <ul class="playlist-list">
        <li class="playlist" id="wallfellow-thanksgiving">
          <div>
            <h2 class="playlist-title">Wallfellow Thanksgiving</h2>
            <p class="playlist-context">The November 2026 playlist.</p>
          </div>
          <div class="embed-slot">
            <iframe
              title="Wallfellow Thanksgiving"
              src="https://open.spotify.com/embed/playlist/7llLSOZeUAIC7IgCAZxfHd?utm_source=generator"
              height="152"
              loading="lazy"
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
        </li>
      </ul>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <span>Wallfellow · Hang it up</span>
        <a href="https://www.etsy.com/shop/WallfellowStore" rel="noopener noreferrer"
          >Etsy · WallfellowStore</a
        >
      </div>
    </footer>

    <script>
      document.querySelectorAll(".embed-slot iframe").forEach((frame) => {
        const src = frame.getAttribute("src") || "";
        if (!src || src === "about:blank") return;
        const slot = frame.closest(".embed-slot");
        if (!slot) return;
        slot.classList.remove("is-placeholder");
        frame.removeAttribute("aria-hidden");
      });
    </script>
  </body>
</html>
