<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallfellow — Hang it up</title>
    <meta
      name="description"
      content="Wallfellow — framed originals and quiet wall pieces. Hang it up."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!--
    Experimental homepage flourishes (HU-45):
    Toggle off by removing class "exp-home" from <body>
    (hides the right Memphis scroll band + lower-left Etsy page fold).
  -->
  <body class="home exp-home">
    <div class="memphis-band" aria-hidden="true">
      <div class="memphis-band__scroll"></div>
    </div>

    <header class="site-header">
      <span class="wordmark" aria-current="page">Wallfellow</span>
      <a class="nav-link" href="pieces/">Pieces</a>
    </header>

    <main class="hero">
      <h1 class="brand">Wallfellow</h1>
      <p class="tagline">Hang it up</p>
      <p class="lede">Framed originals and quiet pieces for the wall.</p>
      <a class="cta" href="pieces/">See the pieces</a>
    </main>

    <footer class="home-footer">
      <a href="https://www.etsy.com/shop/WallfellowStore" rel="noopener noreferrer"
        >Etsy · Wallfellow Store</a
      >
    </footer>

    <a
      class="etsy-fold"
      href="https://www.etsy.com/shop/WallfellowStore"
      rel="noopener noreferrer"
      aria-label="Shop Wallfellow on Etsy"
    >
      <span class="etsy-fold__under">
        <span class="etsy-fold__label">Etsy</span>
        <span class="etsy-fold__shop">Wallfellow Store</span>
        <span class="etsy-fold__hint">Shop the wall</span>
      </span>
      <span class="etsy-fold__flap" aria-hidden="true"></span>
    </a>
  </body>
</html>
