<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallfellow — Hang it up</title>
    <meta
      name="description"
      content="Wallfellow — framed originals and quiet wall pieces. Hang it up."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!--
    Experimental homepage flourish (HU-45):
    Toggle off by removing class "exp-home" from <body>
    (hides the right scroll band; restores footer).
    Decor cycles: off → Memphis → graph paper → dot grid → off (fade).
    Default is off (no scroll band). Home / Pieces restore Memphis.
  -->
  <body class="home exp-home" data-pattern="off">
    <div class="pattern-band" aria-hidden="true">
      <div class="pattern-band__layer pattern-band__layer--memphis">
        <div class="pattern-band__track">
          <div class="pattern-band__tile pattern-band__tile--memphis"></div>
          <div class="pattern-band__tile pattern-band__tile--memphis"></div>
        </div>
      </div>
      <div class="pattern-band__layer pattern-band__layer--graph">
        <div class="pattern-band__track pattern-band__track--graph">
          <div class="pattern-band__tile pattern-band__tile--graph"></div>
          <div class="pattern-band__tile pattern-band__tile--graph"></div>
        </div>
      </div>
      <div class="pattern-band__layer pattern-band__layer--dots">
        <div class="pattern-band__track pattern-band__track--dots">
          <div class="pattern-band__tile pattern-band__tile--dots"></div>
          <div class="pattern-band__tile pattern-band__tile--dots"></div>
        </div>
      </div>
    </div>

    <header class="site-header">
      <a class="wordmark" href="./" data-pattern-set="memphis">Wallfellow</a>
      <nav class="site-nav" aria-label="Primary">
        <a class="nav-link" href="pieces/" data-pattern-set="memphis">Pieces</a>
        <button
          type="button"
          class="nav-link nav-link--decor"
          data-pattern-cycle
          aria-pressed="false"
          aria-label="Cycle decor pattern"
        >
          Decor
        </button>
      </nav>
    </header>

    <main class="hero">
      <h1 class="brand">Wallfellow</h1>
      <p class="tagline">Hang it up</p>
      <p class="lede">Framed originals and quiet pieces for the wall.</p>
      <a class="cta" href="pieces/" data-pattern-set="memphis">See the pieces</a>
    </main>

    <footer class="home-footer">
      <a href="https://www.etsy.com/shop/WallfellowStore" rel="noopener noreferrer"
        >Etsy · Wallfellow Store</a
      >
    </footer>

    <script src="home-pattern.js" defer></script>
  </body>
</html>
