<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <!--
    Seamless graph-paper tile — cobalt lines on transparent (mustard field).
    Minor every 20px, major every 100px. viewBox = 2× major → perfect repeat.
  -->
  <g stroke="#213293" stroke-linecap="square">
    <!-- minor grid -->
    <g stroke-width="1" opacity="0.22">
      <path d="M20 0v200M40 0v200M60 0v200M80 0v200M120 0v200M140 0v200M160 0v200M180 0v200"/>
      <path d="M0 20h200M0 40h200M0 60h200M0 80h200M0 120h200M0 140h200M0 160h200M0 180h200"/>
    </g>
    <!-- major grid -->
    <g stroke-width="1.5" opacity="0.45">
      <path d="M0 0v200M100 0v200M200 0v200"/>
      <path d="M0 0h200M0 100h200M0 200h200"/>
    </g>
  </g>
</svg>
